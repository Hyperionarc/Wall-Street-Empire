# Fly.io : depuis le dossier wall-street-empire/ → fly launch --copy-config --no-deploy (choisis un nom d'application libre), puis fly deploy
# Une seule machine : les salles vivent en mémoire (pas de base de données) ; elle reste allumée pendant les parties.
app = "wse-salle-a-renommer"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
