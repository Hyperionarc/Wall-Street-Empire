# Render (Blueprint) : Dashboard > New > Blueprint > choisir ce dépôt. Un seul service web Node qui sert le jeu et le serveur de salle.
# Aucun secret. Les salles vivent en mémoire : une seule instance.
services:
  - type: web
    name: wall-street-empire
    runtime: node
    plan: free
    rootDir: wall-street-empire
    buildCommand: npm ci --prefix server --omit=dev --no-audit --no-fund
    startCommand: node server/server.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
